<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>テンクル (TEN-KURU)</title>
<!-- v203 PWA：ホーム画面に追加するとアドレスバーなしの全画面アプリとして開く -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0d24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="テンクル">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:linear-gradient(180deg,#0a0020 0%,#12002e 40%,#180040 70%,#1a0035 100%);min-height:100dvh;overflow:hidden;position:fixed;width:100%;height:100dvh;touch-action:none;}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Playfair+Display:wght@400;700;900&family=Fira+Code:wght@400;600&display=swap');
@keyframes dealIn{0%{opacity:0;transform:translateY(-20px) scale(0.75) rotate(-6deg);}60%{transform:translateY(3px) scale(1.06) rotate(1deg);}100%{opacity:1;transform:none;}}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}
@keyframes burst{0%{transform:scale(1)}40%{transform:scale(1.3);opacity:0.7}100%{transform:scale(0.8);opacity:0}}
@keyframes resetAnim{0%{transform:scale(1)}40%{transform:scale(1.08);filter:brightness(1.3)}100%{transform:scale(1);filter:none}}
@keyframes countDown{0%{transform:scale(0.4);opacity:0}40%{transform:scale(1.2);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(0.8);opacity:0}}
@keyframes slideIn{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
@keyframes comboPop{0%{transform:scale(0.3) rotate(-8deg);opacity:0}50%{transform:scale(1.25) rotate(3deg);opacity:1}70%{transform:scale(0.95) rotate(-1deg)}100%{transform:scale(1) rotate(0deg);opacity:1}}
@keyframes comboOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.4) translateY(-30px)}}
@keyframes cyberIn{0%{transform:scale(0.2) skewX(20deg);opacity:0;filter:blur(12px)}40%{transform:scale(1.3) skewX(-4deg);opacity:1;filter:blur(0)}70%{transform:scale(0.97) skewX(1deg)}100%{transform:scale(1) skewX(0);opacity:1;filter:none}}
@keyframes cyberOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.6) translateY(-40px);filter:blur(8px)}}

@keyframes scanline{0%{transform:translateY(-100%)}100%{transform:translateY(100vh)}}
@keyframes chromaRed{0%,100%{transform:translate(0,0)}50%{transform:translate(-3px,1px)}}
@keyframes chromaBlue{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-1px)}}
@keyframes ringExpand{0%{transform:translate(-50%,-50%) scale(0);opacity:0.9}100%{transform:translate(-50%,-50%) scale(3.5);opacity:0}}
@keyframes ringExpand2{0%{transform:translate(-50%,-50%) scale(0);opacity:0.7}100%{transform:translate(-50%,-50%) scale(5);opacity:0}}
@keyframes ptFloat{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-80px) scale(1.4);opacity:0}}
@keyframes hexSpin{0%{transform:translate(-50%,-50%) rotate(0deg) scale(0);opacity:0}20%{opacity:1}100%{transform:translate(-50%,-50%) rotate(180deg) scale(2.5);opacity:0}}
@keyframes gridFlash{0%,100%{opacity:0}50%{opacity:0.25}}
@keyframes titleGlitch{0%,90%,100%{transform:none;filter:none}92%{transform:translateX(-3px);filter:hue-rotate(90deg)}94%{transform:translateX(3px);filter:hue-rotate(-90deg)}96%{transform:none;filter:none}98%{transform:translateX(-1px);filter:brightness(2)}}

/* ============================================
   CARD DESIGN
   ============================================ */
.card-stage{position:relative;display:inline-block;flex-shrink:0;width:var(--card-w);aspect-ratio:5/7;}
/* 陣営色：cyan=自分(青) / magenta=相手(オレンジ)。GPT生成の発光カード画像を使用 */
.card-stage.cyan{--ac:#2e7fe8;--rgb:46,127,232;--cardimg:url('img/card-cyan.webp');}
.card-stage.magenta{--ac:#f5912a;--rgb:245,145,42;--cardimg:url('img/card-magenta.webp');}
/* 数字は墨色（瞬間的に読みやすく）。色分けは廃止 */
.card-stage.n1,.card-stage.n2,.card-stage.n3,.card-stage.n4,.card-stage.n5{--nc:#263240;}

.card-stage .card{
  position:relative;
  width:100%;height:100%;
  overflow:visible;
  z-index:1;
  background:var(--cardimg) center/contain no-repeat;
  border:none;
  box-shadow:none;
}
.card-stage .card::before{
  content:'';
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:1;
}
.card-stage .card::after{
  content:'';
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:1;
}
/* 旧・下辺帯は不使用（カード地が陣営色なので） */
.card-stage .bottom-glow{
  position:absolute;
  bottom:0;left:0;right:0;
  background:transparent;
  pointer-events:none;
  z-index:5;
  display:none;
}
.card-stage .center-pattern{
  position:absolute;
  inset:0;
  width:100%;height:100%;
  pointer-events:none;
  z-index:3;
  opacity:0;
}
.card-stage .cp-star{fill:transparent;}
.card-stage .card-overlay{
  position:absolute;
  inset:0;
  width:100%;height:100%;
  pointer-events:none;
  z-index:4;
  overflow:visible;
  opacity:0;
}
.card-stage .fr-white{stroke:transparent;fill:none;}
.card-stage .fr-cyan{
  stroke:transparent;
  fill:none;
}
.card-stage .ext-bottom-line{
  position:absolute;
  background:transparent;
  pointer-events:none;
  z-index:5;
  display:none;
}
.card-stage .n-big{
  position:absolute;
  inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Outfit','Inter',sans-serif;
  font-weight:900;
  color:var(--nc);
  line-height:1;
  z-index:6;
  pointer-events:none;
  text-shadow:none;
}
.card-stage .n-tl,.card-stage .n-br{
  position:absolute;
  font-family:'Outfit','Inter',sans-serif;
  font-weight:800;
  color:var(--nc);
  z-index:6;
  pointer-events:none;
  opacity:.6;
}
.card-stage .n-br{transform:rotate(180deg);}

/* ★ User-customizable layout (set by HUD edit mode) */
:root{
  --user-hand-w:53;
  --user-hand-y:0;
  --user-field-w:62;
  --user-sum-size:40;
  --user-sum-x:0;
  --user-sum-y:6;
  --user-gap-df:10;
  --user-gap-fh:38;
}

/* HAND cards: width customizable via --user-hand-w */
.hand-card-area{--card-w:calc(var(--user-hand-w) * var(--u));}

/* FIELD cards: width customizable via --user-field-w */
.field-card-area{--card-w:calc(var(--user-field-w) * var(--u));}

/* Card internal proportions — calibrated for 84×118, work for any --card-w */
.card-stage .card{border-radius:calc(var(--card-w) * 0.083);}
.card-stage .bottom-glow{height:calc(var(--card-w) * 0.08);border-radius:0 0 calc(var(--card-w) * 0.083) calc(var(--card-w) * 0.083);}
.card-stage .ext-bottom-line{
  bottom:calc(var(--card-w) * -0.024);
  left:calc(var(--card-w) * 0.083);
  right:calc(var(--card-w) * 0.083);
  height:calc(var(--card-w) * 0.014);
  border-radius:calc(var(--card-w) * 0.008);
  box-shadow:none;
}
.card-stage .n-big{
  font-size:calc(var(--card-w) * 0.56);
  letter-spacing:calc(var(--card-w) * -0.018);
  transform:translateY(calc(var(--card-w) * -0.024));
}
.card-stage .n-tl,.card-stage .n-br{font-size:calc(var(--card-w) * 0.143);}
.card-stage .n-tl{top:calc(var(--card-w) * 0.107);left:calc(var(--card-w) * 0.107);}
.card-stage .n-br{bottom:calc(var(--card-w) * 0.107);right:calc(var(--card-w) * 0.107);}

/* 場の状態：通常は控えめ（白カードは元から見える） */
.card-stage.field .fr-cyan{filter:none;}

/* 10完成状態：決定打の1枚が陣営色で強く光る（白カードが浮き上がる） */
.card-stage.complete .card{
  border:1.5px solid var(--ac);
  box-shadow:
    0 0 4px var(--ac),
    0 0 12px rgba(var(--rgb),.5),
    0 0 24px rgba(var(--rgb),.22),
    0 calc(var(--card-w) * 0.05) calc(var(--card-w) * 0.12) rgba(40,60,90,.22);
  transform:scale(1.08) translateY(calc(var(--card-w) * -0.04));
}
.card-stage.complete .fr-cyan{filter:none;}
.card-stage .plasma{
  position:absolute;
  inset:-14px;
  pointer-events:none;
  z-index:0;
  background:
    radial-gradient(ellipse 80% 80% at 50% 50%, rgba(var(--rgb),.14) 0%, transparent 72%);
  filter:blur(2px);
}

/* ============================================
   GAMEPLAY SCREEN LAYOUT (v8 — 360 base, width+height safety scale)
   ============================================ */
.gp-screen{
  --u:min(calc(100vw / 360), calc(100dvh / 640));
  position:fixed;inset:0;
  width:100vw;height:100dvh;
  /* 明るい曲面ステージ背景（画像）。cover+centerでiPad等でも破綻しない */
  background-image:url('img/bg.jpg');
  background-size:cover;
  background-position:center;
  background-color:#dfe6e6;
  display:flex;flex-direction:column;
  padding:max(env(safe-area-inset-top,0px),calc(14 * var(--u))) calc(12 * var(--u)) max(env(safe-area-inset-bottom,0px),calc(106 * var(--u)));
  border-radius:0;border:none;box-shadow:none;
  overflow:hidden;
}
.gp-screen::before{content:none;}
.gp-screen::after{content:none;}
.gp-screen > *{flex-shrink:0;position:relative;z-index:1;}
.gp-spacer{flex:0;min-height:calc(var(--user-gap-df) * var(--u));}
/* field→hand: user-gap-fh */
.gp-field-area + .gp-spacer{flex:0;min-height:calc(var(--user-gap-fh) * var(--u));}
/* below hand: zero — gp-screen padding-bottom handles it */
.gp-hand-area + .gp-spacer{flex:0;min-height:0;}

/* === TOP HUD === */
.gp-top-bar{
  display:flex;align-items:center;
  gap:calc(6 * var(--u));
  padding:calc(9 * var(--u)) calc(10 * var(--u));
  background:rgba(15,12,30,.4);
  border:1px solid rgba(255,255,255,.07);
  border-radius:calc(22 * var(--u));
  box-shadow:
    inset 0 1px 0 rgba(160,180,230,.14),
    0 calc(12 * var(--u)) calc(28 * var(--u)) rgba(0,0,0,.3);
  backdrop-filter:blur(22px) saturate(120%);-webkit-backdrop-filter:blur(22px) saturate(120%);
  position:relative;z-index:3;
}

/* TIME box: 黒ガラス + 発光する紫の数字 */
.gp-time-box{
  background:rgba(20,15,35,.45);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:
    inset 0 1px 0 rgba(160,140,255,.15),
    0 calc(6 * var(--u)) calc(14 * var(--u)) rgba(0,0,0,.4);
  border-radius:calc(13 * var(--u));
  padding:calc(7 * var(--u)) 0 calc(8 * var(--u));
  width:calc(48 * var(--u));
  text-align:center;flex-shrink:0;
  transition:all 0.3s;
}
.gp-time-box.urgent{background:rgba(60,15,30,.85);border-color:#ff2d6e;animation:pulse 0.5s infinite;}
.gp-time-box .lbl{font-size:calc(9 * var(--u));letter-spacing:calc(1.7 * var(--u));font-weight:700;color:#a8a4c0;line-height:1;}
.gp-time-box.urgent .lbl{color:#ff5b85;}
.gp-time-box .val{font-size:calc(26 * var(--u));font-weight:600;color:#b89aff;text-shadow:0 0 calc(8 * var(--u)) rgba(160,130,255,.5);letter-spacing:calc(-1 * var(--u));line-height:.95;margin-top:calc(3 * var(--u));font-family:'Inter',sans-serif;}
.gp-time-box.urgent .val{color:#ff5b85;text-shadow:0 0 calc(8 * var(--u)) rgba(255,45,110,.6);}

/* Scores: big number + "あと <b>Xpt</b>" subtitle */
.gp-score{text-align:center;flex:1;min-width:0;}
.gp-score .lbl{font-size:calc(9 * var(--u));letter-spacing:calc(1.7 * var(--u));font-weight:700;line-height:1;margin-bottom:calc(3 * var(--u));}
.gp-score .val{font-size:calc(26 * var(--u));font-weight:600;letter-spacing:calc(-.5 * var(--u));line-height:.95;font-family:'Inter',sans-serif;}
.gp-score .sub{font-size:calc(9 * var(--u));font-weight:500;color:rgba(225,225,240,.72);letter-spacing:calc(.3 * var(--u));line-height:1;margin-top:calc(5 * var(--u));}
.gp-score .sub b{font-weight:700;}
.gp-score.you .lbl,.gp-score.you .val,.gp-score.you .sub b{color:#2ccadf;text-shadow:0 0 calc(10 * var(--u)) rgba(44,202,223,.5);}
.gp-score.dealer .lbl,.gp-score.dealer .val,.gp-score.dealer .sub b{color:#f06ba8;text-shadow:0 0 calc(10 * var(--u)) rgba(240,107,168,.5);}

/* R-pill: 黒ガラス + 発光するピンクR + オレンジlevel */
.gp-round-pill{
  background:rgba(20,15,35,.45);
  border:1px solid rgba(255,255,255,.09);
  border-radius:999px;
  padding:calc(7 * var(--u)) calc(13 * var(--u));
  display:flex;align-items:center;gap:calc(6 * var(--u));
  box-shadow:
    inset 0 1px 0 rgba(160,140,255,.15),
    0 calc(6 * var(--u)) calc(14 * var(--u)) rgba(0,0,0,.35);
  flex-shrink:0;
  font-family:'Inter',sans-serif;
}
.gp-round-pill .r{font-size:calc(17 * var(--u));font-weight:700;color:#f06ba8;text-shadow:0 0 calc(6 * var(--u)) rgba(240,107,168,.5);letter-spacing:calc(-.3 * var(--u));line-height:1;}
.gp-round-pill .lvl{font-size:calc(9 * var(--u));font-weight:700;letter-spacing:calc(1.2 * var(--u));line-height:1;}
.gp-round-pill.easy .lvl{color:#3ad98a;text-shadow:0 0 calc(6 * var(--u)) rgba(58,217,138,.4);}
.gp-round-pill.normal .lvl{color:#f7ad6a;text-shadow:0 0 calc(6 * var(--u)) rgba(247,173,106,.4);}
.gp-round-pill.master .lvl{color:#8b5cf6;}
.gp-round-pill.hard .lvl{color:#ff5b85;text-shadow:0 0 calc(6 * var(--u)) rgba(255,91,133,.4);}

/* HOME button: 黒ガラスの角丸スクエア */
.gp-icon-btn{
  width:calc(40 * var(--u));height:calc(40 * var(--u));
  background:rgba(20,15,35,.45);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:
    inset 0 1px 0 rgba(160,140,255,.12),
    0 calc(6 * var(--u)) calc(14 * var(--u)) rgba(0,0,0,.35);
  border-radius:calc(12 * var(--u));
  display:flex;align-items:center;justify-content:center;
  font-size:calc(18 * var(--u));color:#c0bcd5;
  cursor:pointer;flex-shrink:0;
}

/* TRACK button: 黒ガラスの円形 + 回転する破線枠 */
.gp-track-btn{
  position:relative;
  width:calc(40 * var(--u));height:calc(40 * var(--u));
  background:rgba(20,15,35,.45);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:
    inset 0 1px 0 rgba(160,140,255,.12),
    0 calc(6 * var(--u)) calc(14 * var(--u)) rgba(0,0,0,.35);
  border-radius:999px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
}
.gp-track-btn::before{
  content:"";position:absolute;inset:calc(4 * var(--u));
  border-radius:50%;
  border:2px dashed rgba(160,140,255,.55);
  animation:trackRotate 8s linear infinite;
}
.gp-track-btn .num{
  position:relative;
  font-size:calc(13 * var(--u));
  font-weight:600;
  color:#c0bcd5;
  letter-spacing:calc(-.3 * var(--u));
  z-index:1;
  font-family:'Inter',sans-serif;
}
@keyframes trackRotate{
  to{transform:rotate(360deg);}
}

.gp-dealer-area{
  background:rgba(15,12,30,.35);
  border:1px solid rgba(255,255,255,.07);
  border-radius:calc(24 * var(--u));
  padding:calc(11 * var(--u)) calc(14 * var(--u)) calc(13 * var(--u));
  margin-top:calc(6 * var(--u));
  box-shadow:
    inset 0 1px 0 rgba(160,180,230,.1),
    0 calc(10 * var(--u)) calc(24 * var(--u)) rgba(0,0,0,.3);
  backdrop-filter:blur(20px) saturate(120%);-webkit-backdrop-filter:blur(20px) saturate(120%);
}
.gp-area-label{font-size:calc(10 * var(--u));letter-spacing:calc(2.2 * var(--u));color:rgba(225,225,240,.75);font-weight:700;margin-bottom:calc(9 * var(--u));display:flex;align-items:center;gap:calc(6 * var(--u));font-family:'Inter',sans-serif;}
.gp-dealer-cards{display:flex;gap:calc(3 * var(--u));justify-content:center;flex-wrap:nowrap;}
.gp-dealer-card{
  width:calc(26 * var(--u));aspect-ratio:5/7;border-radius:calc(5 * var(--u));
  background:linear-gradient(165deg, #f5912a 0%, #c4600f 100%);
  border:1px solid rgba(255,255,255,.5);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.35),
    0 calc(5 * var(--u)) calc(10 * var(--u)) rgba(120,70,20,.22);
  flex-shrink:0;
}

.gp-field-area{
  position:relative;
  overflow:hidden;
  background:transparent;
  border:none;
  border-radius:calc(28 * var(--u));
  padding:calc(14 * var(--u)) calc(18 * var(--u));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(8 * var(--u));
  flex:1;min-height:calc(140 * var(--u));
  box-shadow:none;
  filter:none;
  backdrop-filter:none;-webkit-backdrop-filter:none;
  transition:filter 0.25s;
}
/* HUD: faint concentric rings + repeating texture, inset from edges */
.gp-field-area::before{
  content:"";
  position:absolute;
  inset:8% 4%;
  pointer-events:none;
  z-index:0;
  opacity:.18;
  background:
    repeating-radial-gradient(circle at 50% 52%,
      rgba(160,140,255,.4) 0px,
      rgba(160,140,255,.4) 1px,
      transparent 2px,
      transparent calc(18 * var(--u))),
    radial-gradient(circle at 50% 52%,
      transparent 0 28%,
      rgba(160,140,255,.5) 29%,
      transparent 30%,
      transparent 42%,
      rgba(160,140,255,.35) 43%,
      transparent 44%,
      transparent 58%,
      rgba(160,140,255,.25) 59%,
      transparent 60%);
  animation:fieldBreath 10s ease-in-out infinite;
}
/* 微粒子 */
.gp-field-area::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:0;
  opacity:.4;
  background:
    radial-gradient(circle at 16% 42%, rgba(180,170,255,.7) 0 1px, transparent 2px),
    radial-gradient(circle at 23% 56%, rgba(180,170,255,.5) 0 1px, transparent 2px),
    radial-gradient(circle at 72% 34%, rgba(180,170,255,.55) 0 1px, transparent 2px),
    radial-gradient(circle at 86% 62%, rgba(180,170,255,.48) 0 1px, transparent 2px),
    radial-gradient(circle at 38% 22%, rgba(180,170,255,.42) 0 1px, transparent 2px),
    radial-gradient(circle at 62% 78%, rgba(180,170,255,.38) 0 1px, transparent 2px),
    radial-gradient(circle at 50% 52%, rgba(120,90,200,.15), transparent 45%);
}
.gp-field-area > *{position:relative;z-index:1;}

@keyframes fieldBreath{
  0%,100% {opacity:.12;transform:scale(1);}
  50%     {opacity:.22;transform:scale(1.012);}
}

/* 右下の惑星アイコン (subtle Saturn-like line art) */
.field-planet{
  position:absolute;
  right:7%;
  bottom:9%;
  width:calc(50 * var(--u));
  height:calc(38 * var(--u));
  opacity:.40;
  pointer-events:none;
  z-index:1;
}
.field-planet::before{
  content:"";position:absolute;
  inset:calc(5 * var(--u)) calc(12 * var(--u));
  border:1.4px solid rgba(170,155,230,.55);
  border-radius:50%;
}
.field-planet::after{
  content:"";position:absolute;
  left:calc(2 * var(--u));right:calc(2 * var(--u));
  top:calc(18 * var(--u));
  height:1.4px;
  background:rgba(170,155,230,.55);
  border-radius:999px;
  transform:rotate(-18deg);
}


.gp-field-area.warn{
  filter:drop-shadow(0 0 calc(14 * var(--u)) rgba(255,159,28,.30)) drop-shadow(0 calc(12 * var(--u)) calc(28 * var(--u)) rgba(119,103,178,.12));

/* =========================================================
   HUDだけサイバー角（下両角を斜めカット）＋極薄シアン発光＋左右発光ライン
   カード・手札マットには一切適用しない（.gp-top-bar限定）
   ========================================================= */
.gp-top-bar{
  position:relative !important;
  /* 下の両角を斜めカット */
  clip-path:polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px)) !important;
  /* 左右端に細い発光ライン（背景グラデで描画） */
  background-image:
    linear-gradient(180deg, transparent 22%, rgba(110,200,225,.75) 50%, transparent 78%),
    linear-gradient(180deg, transparent 22%, rgba(110,200,225,.75) 50%, transparent 78%) !important;
  background-position:left center, right center !important;
  background-size:2px 60%, 2px 60% !important;
  background-repeat:no-repeat !important;
  /* カット形に沿った極薄シアンの発光（clip-path形状を保ったまま） */
  filter:drop-shadow(0 0 3px rgba(110,200,225,.45)) !important;
  backdrop-filter:none !important;-webkit-backdrop-filter:none !important;
}

<svg style="position:absolute;width:0;height:0;" aria-hidden="true">
<defs>
<filter id="plasma-filter" x="-30%" y="-30%" width="160%" height="160%">
<feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="3" seed="5"/>
<feDisplacementMap in="SourceGraphic" scale="40"/>
</filter>
</defs>
</svg>
<div id="root"></div>
<script>
const h=React.createElement;
const{useState,useEffect,useRef,useCallback,useMemo}=React;

// ── 定数 ──
const PANEL='#1a0a3a',BORDER='#4a2a8a';
const PINK='#00d4ff',PINK2='#80eeff',RED_C='#ff2d6e',BLUE_C='#ffaa00';
const TEXT='#ffffff',DIM='#e0d0ff';
const CC={1:'#c0003a',2:'#c05800',3:'#0068a0',4:'#6010b0',5:'#007a40'};
const WIN_PT=15;

// ── ゲームロジック ──
function createDeck(){
  const d=[];
  while(d.length<10){
    const v=Math.floor(Math.random()*5)+1;
    if(d.filter(x=>x===v).length<3)d.push(v);
  }
  return d.sort(()=>Math.random()-0.5);
}

function calcPts(cards){
  const s=[...cards].sort((a,b)=>a-b);
  if(cards.length===4&&s.join('')==='1234')return{total:5,label:'ストレート +5pt',voice:'ストレート'};
  if(cards.length===2&&s[0]===5&&s[1]===5)return{total:1,label:'役なし +1pt',voice:'役なし'};
  const freq={};
  cards.forEach(v=>{freq[v]=(freq[v]||0)+1;});
  const counts=Object.values(freq);
  if(counts.some(c=>c>=3))return{total:4,label:'スリーカード +4pt',voice:'スリーカード'};
  if(counts.filter(c=>c===2).length>=2)return{total:3,label:'ツーペア +3pt',voice:'ツーペア'};
  if(counts.some(c=>c===2))return{total:2,label:'ワンペア +2pt',voice:'ワンペア'};
  return{total:1,label:'役なし +1pt',voice:'役なし'};
}

function canPlay(v,fieldSum,field){
  if(field.filter(x=>x!==null).length>=4)return false;
  const filled=field.filter(x=>x!==null).length+1;
  const newSum=fieldSum+v;
  if(filled===3&&newSum<5)return false;
  if(filled===4&&newSum<10)return false;
  return true;
}

// ── BGM（2曲切り替え：1=Neon Strategy / 2=Cold Logic / 0=ミュート）v43 ──
// GitHub Pagesのリポジトリ直下にmp3を置く前提
const BGM_FILES={1:'Neon%20Strategy.mp3',2:'Cold%20Logic.mp3'}; // v45: 実ファイル名(スペース入り)に一致させた
let bgmAudio=null,bgmPlayingTrack=0;
function stopBGM(){
  bgmPlayingTrack=0;
  if(bgmAudio){bgmAudio.pause();bgmAudio.currentTime=0;}
}
// v67: file を渡すとその曲（ステージ専用BGM）。無ければ track 番号の曲
function startBGM(track,file){
  const t=file?('file:'+file):(BGM_FILES[track]?track:1);
  if(bgmPlayingTrack===t&&bgmAudio&&!bgmAudio.paused)return; // 同じ曲が再生中なら何もしない
  try{
    if(bgmAudio)bgmAudio.pause();
    bgmAudio=new Audio(file||BGM_FILES[t]);
    bgmAudio.loop=true;
    bgmAudio.volume=0.45;
    bgmPlayingTrack=t;
    bgmAudio.play().catch(()=>{});
  }catch(e){bgmPlayingTrack=0;}
}

// SE用AudioContext（BGMとは独立）
const AC=new(window.AudioContext||window.webkitAudioContext)();
function resumeAC(){if(AC.state==='suspended')AC.resume();}
// PC Chrome対策：最初のタッチ/クリックでACを即座に起動
document.addEventListener('pointerdown',()=>{resumeAC();},{once:true,capture:true});

// ==== 軽量星画像（SVGを1枚焼いてbackgroundで使い回す）====
// clip-path + drop-shadow をGPUに毎回計算させる代わりに、光のにじみ込みの星を画像化。
// ミドル端末(OPPO等)でのカクつき対策
// ==== 手札の状態判定 (v48) ====
// 'win'=10完成 / 'danger'=出せるがバースト / 'locked'=ルール上出せない / null=通常
function handCardState(v,sum,field){
  if(!canPlay(v,sum,field))return 'locked';
  const ns=sum+v;
  return ns===10?'win':ns>10?'danger':null;
}
function lockReason(v,sum,field){
  const filled=field.filter(x=>x!==null&&x!==0).length+1;
  const ns=sum+v;
  if(filled===3&&ns<5)return '3枚目は 合計5以上 になるカードだけ';
  if(filled===4&&ns<10)return '4枚目は 合計10以上 になるカードだけ';
  return '今は出せないカード';
}
// 出せないカードをタップした時の理由トースト
function fxLockHint(text){
  let el=document.querySelector('.fx2-hint');
  if(el)el.remove();

  el.className='fx2-hint';
  el.textContent='🔒 '+text;
  document.body.appendChild(el);
  void el.offsetWidth;el.classList.add('go');
  setTimeout(()=>{if(el.parentNode)el.remove();},1600);
}

function fxChronoToast(text){
  let el=document.querySelector('.fx2-hint');if(el)el.remove();
  el=document.createElement('div');el.className='fx2-hint';el.textContent='✦ '+text;
  document.body.appendChild(el);void el.offsetWidth;el.classList.add('go');
  setTimeout(()=>{if(el.parentNode)el.remove();},1500);
}
const starImgCache={};
function starImg(core,glow){
  const k=core+'|'+glow;
  if(!starImgCache[k]){
    const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">'
      +'<defs><radialGradient id="g"><stop offset="0%" stop-color="'+glow+'" stop-opacity=".8"/><stop offset="55%" stop-color="'+glow+'" stop-opacity=".22"/><stop offset="100%" stop-color="'+glow+'" stop-opacity="0"/></radialGradient></defs>'
      +'<circle cx="20" cy="20" r="20" fill="url(#g)"/>'
      +'<path d="M20 5 L24.2 15.8 L35 20 L24.2 24.2 L20 35 L15.8 24.2 L5 20 L15.8 15.8 Z" fill="'+core+'"/>'
      +'</svg>';
    starImgCache[k]='url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
  }
  return starImgCache[k];
}

// ==== 端末性能の自動判定（演出の軽量化）====
// 起動後1.8秒待ってから1秒間FPSを計測。低スペック端末では星の数を自動で間引く
let FX_QUALITY=1; // 1=フル / 0.7=中 / 0.4=軽量
(function(){
  setTimeout(()=>{
    let frames=0;
    const t0=performance.now();
    function loop(){
      frames++;
      if(performance.now()-t0<1000)requestAnimationFrame(loop);
      else FX_QUALITY=frames>=55?1:frames>=40?0.7:0.4;
    }
    requestAnimationFrame(loop);
  },1800);
})();

// ==== ホールリバーブ（幻想の残響・ver39）====
const FXCONV=AC.createConvolver();
(function(){
  const dur=2.4,len=Math.floor(AC.sampleRate*dur);
  const ir=AC.createBuffer(2,len,AC.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=ir.getChannelData(ch);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);
  }
  FXCONV.buffer=ir;
})();
const FXWET=AC.createGain();FXWET.gain.value=0.6;
FXCONV.connect(FXWET);FXWET.connect(AC.destination);
// v198 勝利の音：上昇する3連ベル＋余韻。ボス撃破はもう1段上に伸ばす
// v202 勝利音：鋭いアタック（短いノイズ気味の高音）＋澄んだ響き（高いベル）＋短い余韻（低い三角波）。役割を分けて重ねすぎない
function playWinSE2(boss){try{resumeAC();

  fxTone({f:1568,f2:1568,type:'triangle',v:0.06,a:0.001,d:0.08,rev:0.3});
  fxBell({f:boss?1975:1760,v:0.11,d:boss?1.6:1.0,bright:1.4,rev:0.85,t:0.02});   // 澄んだ響き
  fxBell({f:boss?2637:2349,v:0.05,d:boss?1.2:0.8,bright:1.2,rev:0.9,t:0.05});
  fxTone({f:boss?392:440,f2:boss?392:440,type:'triangle',v:0.06,a:0.02,d:boss?1.1:0.55,rev:0.6,t:0.03}); // 余韻
  if(boss){fxBell({f:1319,v:0.08,d:1.8,bright:1.1,rev:0.9,t:0.32});fxBell({f:1760,v:0.07,d:1.8,bright:1.1,rev:0.9,t:0.5});}
}catch(e){}}
function playWinSE(boss){try{resumeAC();const base=boss?[784,988,1175,1568,1976]:[880,1109,1319,1760];base.forEach((f,i)=>fxBell({f,v:0.085,d:boss?1.6:1.1,bright:1.3,rev:0.8,t:i*(boss?0.11:0.09)}));fxTone({f:220,f2:440,type:'triangle',v:0.08,a:0.01,d:boss?0.9:0.5,rev:0.5});}catch(e){}}
function playLoseSE(){try{resumeAC();fxTone({f:440,f2:180,type:'sawtooth',v:0.09,a:0.01,d:0.7,rev:0.4});fxTone({f:330,f2:140,type:'triangle',v:0.08,a:0.02,d:0.9,t:0.12,rev:0.4});}catch(e){}}
// ドライ＋リバーブセンドの2系統出力
function fxOut(node,rev){
  node.connect(AC.destination);
  if(rev>0){const s=AC.createGain();s.gain.value=rev;node.connect(s);s.connect(FXCONV);}
}
function fxTone({f=440,f2=0,type='sine',v=0.15,a=0.005,d=0.3,t=0,det=0,rev=0.5}){
  try{
    const t0=AC.currentTime+t;
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t0);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
    if(det)o.detune.value=det;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(v,t0+a);
    g.gain.exponentialRampToValueAtTime(0.0008,t0+a+d);
    o.connect(g);fxOut(g,rev);
    o.start(t0);o.stop(t0+a+d+0.05);
  }catch(e){}
}
// ── v130 セトラの氷の音 ──
// 氷は「高い倍音のきしみ」＋「細かいノイズ」でできている。
// 単音のサイン波だとぴよぴよした電子音になるので、必ずノイズを重ねる。
function fxIceFreeze(){ // 札が凍る瞬間：上から降りてきて固まる
  try{
    // v131: 音量を上げ、頭に鋭い一撃を置いて他の音に埋もれないようにした
    fxAir({v:0.20,a:0.001,d:0.10,hp:8000,rev:0.3});             // パキッ！という衝撃（気づかせる役）
    fxTone({f:3600,f2:900,type:'triangle',v:0.10,a:0.001,d:0.18,rev:0.4}); // 鋭い落下
    fxAir({v:0.16,a:0.005,d:0.55,t:0.02,hp:5200,rev:0.75});      // 吹きつける冷気

// ── 10完成音の道具（osc/noise/sweep/reverb）──
function osc({freq=220,type='sine',vol=0.15,attack=0.01,decay=0.2,start=0,end=0,detune=0,curve='exp'}){
  try{
    const t=AC.currentTime+start;
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=freq;if(detune)o.detune.value=detune;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+attack);
    if(curve==='exp')g.gain.exponentialRampToValueAtTime(0.0001,t+attack+decay);
    else g.gain.linearRampToValueAtTime(0.0001,t+attack+decay);
    o.connect(g);g.connect(AC.destination);
    o.start(t);o.stop(t+attack+decay+0.05);
  }catch(e){}
}
function noise({vol=0.2,dur=0.3,start=0,lpFreq=800,hpFreq=0,q=1}){
  try{
    const t=AC.currentTime+start;
    const buf=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const src=AC.createBufferSource(),g=AC.createGain();
    const lp=AC.createBiquadFilter();
    lp.type='lowpass';lp.frequency.value=lpFreq;lp.Q.value=q;
    src.buffer=buf;
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(lp);lp.connect(g);g.connect(AC.destination);
    src.start(t);src.stop(t+dur+0.05);
  }catch(e){}
}
function sweep({startFreq=400,endFreq=100,vol=0.15,dur=0.3,start=0,type='sine'}){
  try{
    const t=AC.currentTime+start;
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;
    o.frequency.setValueAtTime(startFreq,t);
    o.frequency.exponentialRampToValueAtTime(endFreq,t+dur);
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(AC.destination);
    o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}
function reverb({freq=440,vol=0.05,start=0}){
  [0,0.04,0.09,0.16].forEach((d,i)=>{
    osc({freq:freq*(1+i*0.003),type:'sine',vol:vol*(1-i*0.22),attack:0.005,decay:0.4+d,start:start+d});
  });
}

function playComboSfx(voice){

  // Y2 星の開花：Lvが上がるほど「溜め」が長く、咲く和音が豊かに、降る星屑が多く
  const conf={
    1:{T:0,   bloom:[2093],            rain:[],                         bd:0.5,top:0},
    2:{T:0,   bloom:[2093,2637],       rain:[3520],                     bd:0.7,top:0},
    3:{T:0.12,bloom:[2093,2637,3136],  rain:[3520,4186],                bd:0.9,top:0},
    4:{T:0.2, bloom:[2093,2637,3136],  rain:[3520,4186,3951],           bd:1.2,top:0},
    5:{T:0.35,bloom:[2093,2637,3136],  rain:[3520,4186,3951,3136,4699], bd:1.6,top:4186}
  }[lv];
  const T=conf.T;
  // 【溜め】低い光の膨らみ＋息を吸う空気（映像の収束と同期）
  if(T>0){
    fxTone({f:523,type:'sine',v:0.07,a:T*0.6,d:T*0.8,rev:0.6});
    fxTone({f:659,type:'sine',v:0.06,a:T*0.6,d:T*0.8,rev:0.6});
    fxAir({v:0.04,a:T*0.7,d:0.3,hp:8000,rev:0.6});
  }
  // 【開花】高い和音がふわっと咲く
  conf.bloom.forEach((f,i)=>fxBell({f,v:0.13-i*0.025,d:conf.bd,t:T+i*0.02,bright:1+i*0.08,rev:0.7}));
  // 【星屑】咲いた後に高音が降り注ぐ
  conf.rain.forEach((f,i)=>fxBell({f,v:0.055,d:0.5,t:T+0.16+i*0.1,bright:1.2,rev:0.8}));
  // 【余韻】スリーカード以上はシマーの空気、ストレートは最高音が長く響く
  if(lv>=4)fxAir({v:0.04,a:0.05,d:lv===5?1.1:0.6,t:T+0.2,hp:9500,rev:0.8});

}

        ov.appendChild(dim);
        dim.animate([{opacity:0},{opacity:1,offset:.3},{opacity:1,offset:.85},{opacity:0}],{duration:D+180,easing:'ease-out',fill:'forwards'});
      }
      const cvN=Math.max(4,Math.round((p.myth?20:(lv===4?12:7))*FX_QUALITY));
      const W0=window.innerWidth,H0=window.innerHeight;
      for(let i=0;i<cvN;i++){
        const s=document.createElement('div');
        // 画面全域のランダムな位置から中心へ
        const sx=Math.random()*W0-cx,sy=Math.random()*H0-cy;
        const sz=Math.round((5+Math.random()*8)*1.7);
        s.style.cssText='position:absolute;left:'+cx+'px;top:'+cy+'px;width:'+sz+'px;height:'+sz+'px;background:'+starImg('#ffffff',p.ac)+' center/contain no-repeat;opacity:0;';
        ov.appendChild(s);
        s.animate([
          {opacity:0,transform:'translate(-50%,-50%) translate('+sx+'px,'+sy+'px) scale(.6) rotate(0deg)'},
          {opacity:1,offset:.3},
          {opacity:1,transform:'translate(-50%,-50%) scale(1.1) rotate(180deg)'}
        ],{duration:D,delay:Math.random()*60,easing:'cubic-bezier(.5,0,.9,.5)',fill:'forwards'});
      }
    }

    later(()=>{
      // ⓪ 夜のベール：画面全体が一瞬「夜空」になる（迫力の土台）
      const veil=document.createElement('div');
      veil.style.cssText='position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(8,16,38,'+(p.veil*0.55)+') 0%,rgba(8,16,38,'+p.veil+') 80%);opacity:0;';
      ov.appendChild(veil);
      veil.animate([{opacity:0},{opacity:1,offset:.1},{opacity:1,offset:.68},{opacity:0}],{duration:p.myth?2600:2000,easing:'ease-out',fill:'forwards'});
      // ① 空間全体がふわっと明るくなる
      const imp=document.createElement('div');imp.className='fx2-impact'+(isBurst?' red':'');
      ov.appendChild(imp);void imp.offsetWidth;imp.classList.add('go');
      // ② 巨大な星：テキストの背後でゆっくり回りながら現れる（星盤＝完成装置）
      const gs=document.createElement('div');
      const giantSz=Math.round(p.giant*1.15);
      gs.style.cssText='position:absolute;left:'+cx+'px;top:'+cy+'px;width:'+giantSz+'px;height:'+giantSz+'px;background:'+starImg('#ffffff',p.ac)+' center/contain no-repeat;opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(0deg);';
      ov.appendChild(gs);
      gs.animate([
        {opacity:0,transform:'translate(-50%,-50%) scale(.15) rotate(-30deg)'},
        {opacity:1,offset:.18},
        {opacity:p.myth?.85:.6,offset:.55},
        {opacity:0,transform:'translate(-50%,-50%) scale('+(p.myth?1.5:1.2)+') rotate(35deg)'}
      ],{duration:p.myth?2200:1400,easing:'ease-out',fill:'forwards'});
      // ③ 光輪
      for(let i=0;i<p.rings;i++){
        const w=document.createElement('div');w.className='fx2-wave'+(i?' b':'');
        w.style.left=cx+'px';w.style.top=cy+'px';
        if(i===2){w.style.borderColor=p.ac;w.style.animationDelay='.26s';}
        ov.appendChild(w);void w.offsetWidth;w.classList.add('go');
      }
      // ④ 星のバースト：四芒星が中心から画面の隅々まで飛び散り、瞬いて消える
      const W=window.innerWidth,H=window.innerHeight;
      for(let i=0;i<p.bs;i++){
        const s=document.createElement('div');
        const sz=Math.round((6+Math.random()*14)*(Math.random()<.15?1.8:1)*1.6); // たまに大きい星
        const col=Math.random()<.5?'#ffffff':p.ac;
        s.style.cssText='position:absolute;left:'+cx+'px;top:'+cy+'px;width:'+sz+'px;height:'+sz+'px;background:'+starImg(col,p.ac)+' center/contain no-repeat;opacity:0;';
        ov.appendChild(s);
        // 画面全域のランダムな行き先へ
        const tx=Math.random()*W-cx,ty=Math.random()*H-cy;
        const rot=Math.random()*360-180;
        s.animate([
          {opacity:0,transform:'translate(-50%,-50%) scale(.3)'},
          {opacity:1,offset:.1},
          {opacity:1,transform:'translate(-50%,-50%) translate('+tx*0.75+'px,'+ty*0.75+'px) rotate('+rot*0.7+'deg) scale(1)',offset:.55},
          {opacity:.4,offset:.75},
          {opacity:0,transform:'translate(-50%,-50%) translate('+tx+'px,'+ty+'px) rotate('+rot+'deg) scale(.4)'}
        ],{duration:1300+Math.random()*900,easing:'cubic-bezier(.16,.7,.3,1)',fill:'forwards'});
      }
      // ⑤ 夜空の星：画面のあちこちにぽつぽつ星が生まれて瞬く
      for(let i=0;i<p.sky;i++){
        later(()=>{
          const s=document.createElement('div');
          const sz=Math.round((4+Math.random()*9)*1.7);
          const x=Math.random()*W,y=Math.random()*H;
          s.style.cssText='position:absolute;left:'+x+'px;top:'+y+'px;width:'+sz+'px;height:'+sz+'px;background:'+starImg('#ffffff',p.ac)+' center/contain no-repeat;opacity:0;transform:translate(-50%,-50%);';
          ov.appendChild(s);
          s.animate([
            {opacity:0,transform:'translate(-50%,-50%) scale(.2)'},
            {opacity:1,offset:.25,transform:'translate(-50%,-50%) scale(1.15)'},
            {opacity:.35,offset:.55},
            {opacity:.95,offset:.75},
            {opacity:0,transform:'translate(-50%,-50%) scale(.5)'}
          ],{duration:1000+Math.random()*800,easing:'ease-out',fill:'forwards'});
        },Math.random()*(p.myth?900:550));
      }
      // ⑥ 流れ星：ツーペア以上。画面を斜めに横切る（ストレートは流星群）
      for(let i=0;i<p.shoot;i++){
        later(()=>{
          const st=document.createElement('div');
          const x0=Math.random()*W*0.9+W*0.2,y0=-40-Math.random()*H*0.25;
          const len=70+Math.random()*70;
          st.style.cssText='position:absolute;left:'+x0+'px;top:'+y0+'px;width:2.5px;height:'+len+'px;border-radius:2px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.95),#fff);transform:rotate(35deg);opacity:0;';
          ov.appendChild(st);
          const dist=H*0.7+Math.random()*H*0.4;
          st.animate([
            {opacity:0,transform:'rotate(35deg) translateY(0)'},
            {opacity:1,offset:.12},
            {opacity:1,offset:.7},
            {opacity:0,transform:'rotate(35deg) translateY('+dist+'px)'}
          ],{duration:650+Math.random()*350,easing:'cubic-bezier(.3,.1,.6,1)',fill:'forwards'});
        },i*(p.myth?130:220)+Math.random()*120);
      }
      // ⑦ 金以上：後光レイ
      if(p.rays){
        const rayN=FX_QUALITY<0.5?6:10;
        for(let i=0;i<rayN;i++){
          const ray=document.createElement('div');
          const deg=i*(360/rayN);
          ray.style.cssText='position:absolute;left:50%;top:40%;width:5px;height:52vh;transform-origin:center top;border-radius:4px;background:linear-gradient(180deg,rgba('+p.rgb+',.45),transparent);opacity:0;';
          ov.appendChild(ray);
          ray.animate([
            {opacity:0,transform:'rotate('+deg+'deg)'},
            {opacity:.7,offset:.18},
            {opacity:0,transform:'rotate('+(deg+20)+'deg)'}
          ],{duration:1900,easing:'ease-out',fill:'forwards'});
        }
      }
      // ⑧ バーストは薄紅の霧＋星が静かに落ちていく
      if(isBurst){
        const vg=document.createElement('div');
        vg.style.cssText='position:absolute;inset:0;box-shadow:inset 0 0 130px 50px rgba(255,140,160,.4);opacity:0;';
        ov.appendChild(vg);
        vg.animate([{opacity:1},{opacity:0}],{duration:1300,easing:'ease-out',fill:'forwards'});
      }
      // ⑨ テキスト：光が集まって文字が滲み出る
      const slam=document.createElement('div');
      slam.className=isBurst?'fx2-slam fx2-burst':'fx2-slam';
      const bigCls='big'+(lv>=4?' grad':'')+(p.myth?' myth':'');
      const starsHtml=(!isBurst&&lv>=2)?'<span class="stars">'+'✦'.repeat(lv)+'</span>':'';
      slam.innerHTML=isBurst
        ?'<span class="who" style="color:'+whoColor+'">'+whoLabel+'</span><span class="big">BURST</span><span class="pts" style="color:#ffb3c0">-2pt</span>'
        :'<span class="who" style="color:'+whoColor+'">'+whoLabel+'</span><span class="'+bigCls+'">'+combo.text+'</span>'+starsHtml+'<span class="pts">+'+(combo.pts||1)+'pt</span>';
      ov.appendChild(slam);
      const bigEl=slam.querySelector('.big');
      if(bigEl){
        // 文字数に応じて画面幅に収める（「ストレート」の折り返し防止）
        const tlen=(isBurst?'BURST':combo.text).length;
        const maxPx=Math.max(26,Math.floor(window.innerWidth*0.92/Math.max(tlen,3))-4);
        bigEl.style.fontSize='min(calc(clamp(34px,10vw,64px) * '+p.scale+'), '+maxPx+'px)';
      }
      void slam.offsetWidth;slam.classList.add('go');
      later(()=>slam.classList.add('out'),p.myth?2100:1650);
    },D);

    const t=setTimeout(()=>ov.remove(),D+(lv===5?2700:2100));
    return ()=>{clearTimeout(t);timers.forEach(clearTimeout);ov.remove();};
  },[combo]);
  return null;
}

function SlideCard({value,onPlay,disabled,cardRole,cardState,onLocked,isSpecial,linkPick,rLock,rCmd,rWait,confused,frozen,justFrozen,pRing,shuffling,marked,dark,newRefill}){
  const[pressed,setPressed]=useState(false);
  const[shaking,setShaking]=useState(false);
  const isBlue=cardRole==='player'||cardRole==='host';
  const colorClass=isBlue?'cyan':'magenta';
  const locked=cardState==='locked';
  const stateClass=(cardState?' cs-'+cardState:'')+(newRefill?' survival-new':'');
  return h('div',{
    className:'card-stage '+colorClass+' n'+value+stateClass+(dark?' lantern-dark':'')+(frozen!=null?' frozen':'')+(justFrozen?' just-frz':'')+(pRing?' p-ring':'')+(shuffling?' shuf-fx':'')+(marked?' mark-fx':'')+(shaking?' cs-shake':'')+(isSpecial?' sv-card sv-born':'')+(linkPick?' link-pick':'')+(rLock?' rl-locked':'')+(rCmd?' rl-cmd':'')+(rWait?' rl-wait':'')+(confused?' confused':''),
    style:{
      opacity:(disabled&&!locked)?0.3:undefined, // lockedの見た目はCSSに任せる(カウントダウン中等の無効はここで薄く)
      animation:'dealIn 0.22s cubic-bezier(0.2,1.3,0.5,1) both',
      cursor:disabled?'default':'pointer',
      transform:pressed&&!disabled?'scale(0.93)':'scale(1)',
      transition:'transform 0.1s ease',
      userSelect:'none',WebkitUserSelect:'none',touchAction:'manipulation',
    },
    // pressed は「縮む見た目」専用。タップ判定は onClick 一本に統一して取りこぼしを防ぐ
    onPointerDown:()=>{if(!disabled)setPressed(true);},
    onPointerUp:()=>setPressed(false),
    onPointerCancel:()=>setPressed(false),
    onPointerLeave:()=>setPressed(false),
    onClick:()=>{
      if(!disabled){onPlay();return;}
      // v48: 出せないカードは首を振って理由を教える
      if(locked&&onLocked){setShaking(true);setTimeout(()=>setShaking(false),340);onLocked();}
    },
  },
    h('div',{className:'card'},
      ...renderCardOverlay(),
      isSpecial&&h('div',{className:'sv-wrap'},h('div',{className:'sv'})), // v54: 渦（数字より下・背景より上）
      rLock&&h('div',{className:'rl-badge',style:{backgroundImage:'url('+REIPIA_RINGS.lock.image+')'}}), // v84 星環ロック
      rCmd&&h('img',{className:'rl-frame',src:'img/card-gold-designation-frame.webp',alt:'',draggable:false}), // v87 指名：金の外枠
      frozen!=null&&h('div',{className:'frz-ice'}), // v127 セトラ：凍結の氷
      frozen!=null&&h('div',{className:'frz-sec'},frozen+'s'), // v137 数字と混同しないよう s を付ける
      h('span',{className:'n-tl'},value),
      h('span',{className:'n-big'},value),
      h('span',{className:'n-br'},value)
    ),
    !disabled&&h('div',{className:'ext-bottom-line'})
  );
}
function FieldCard({decisive,value,by,isComplete,isSpecial,shifted,ringed}){

// v119: 対戦前に相手のギミックを見せる画面。初見で対策できないという声への対応
// description は「ギミック名：説明」形式なので最初の「：」で割る
function stageBrief(st){
  // v126: ギミック名は説明文からではなくステージの設定値から組み立てる。
  // description の書式が変わっても壊れないようにするため（以前は「：」で分割していた）
  const d=String(st.description||'');
  let gName;
  if(st.ability==='orbit')gName='観測の星環';
  else if(st.ability==='freeze')gName='氷結の星環';
  else if(st.ability==='confuse')gName='鱗粉の幻惑';
  else if(st.ability==='starRing')gName='星環';
  else if(st.ability==='coreShift')gName='コア・シフト';
  else if(st.rule==='shuffle')gName='シャッフル';
  else if(st.rule==='frost')gName='フロスト・ロック';
  else if(st.tutorial)gName='チュートリアル';
  else if(st.chrono&&CHRONO_CONFIG.enabled)gName='クロノリンク';
  else gName='通常ルール';
  // 補足（速い相手・短い持ち時間）は説明の頭に足す
  const ex=[];
  if(st.ability==='orbit')ex.push('星環を出すと3種のうち1つが起きる。再観測＝こちらの手札の数字が全て変わる／捕獲軌道＝こちらの手札3枚を奪う／不可観測＝相手の手札が5ラウンド裏返る');
  if(st.deny)ex.push('こちらに10を作らせない立ち回りをする');
  if(st.ability==='freeze')ex.push('凍った札は右下の秒数が0になるまで出せない');
  if(st.smart)ex.push('こちらの手札を読んで手を選んでくる');
  if(st.speed&&st.speed<1)ex.push('相手の手が速い');
  if(st.timeLimit&&st.timeLimit<10)ex.push('持ち時間が短い');
  let gText=d.replace(/\s*先取\d+pt\s*$/,'').replace(/。$/,'');
  if(ex.length)gText=gText+'。'+ex.join('。');
  return{
    rival:st.rivalName||st.name||'',
    gName,
    gText:gText||'特別なギミックはありません。純粋な読み合いです。',
    winPt:st.winPt||WIN_PT,
    sec:st.timeLimit||10,
    diff:DIFF_LABEL[st.diff]||'NORMAL'
  };
}
// v120: ステージ専用のイントロ動画。画面タップでいつでもスキップできる
function IntroVideoScreen({src,onDone}){
  const vRef=useRef(null);const doneR=useRef(false);
  const[canSkip,setCanSkip]=useState(false);
  function finish(){if(doneR.current)return;doneR.current=true;onDone();}
  useEffect(()=>{
    const t=setTimeout(()=>setCanSkip(true),600); // 誤タップで一瞬で飛ぶのを防ぐ
    const v=vRef.current;
    if(v){v.play().catch(()=>finish());} // 再生が拒否された端末では素通し
    const guard=setTimeout(finish,13000);  // 動画が壊れていても必ず先へ進む
    return()=>{clearTimeout(t);clearTimeout(guard);};
  },[]);
  return h('div',{className:'iv-screen',onClick:()=>{if(canSkip)finish();}},
    h('video',{ref:vRef,className:'iv-video',src,playsInline:true,muted:true,autoPlay:true,preload:'auto',
      onEnded:finish,onError:finish}),
    canSkip&&h('div',{className:'iv-skip'},'タップでスキップ')
  );
}
function BriefScreen({stage,onStart}){

        h('div',{className:'bf-m'},h('span',{className:'l'},'難易度'),h('span',{className:'v'},b.diff))
      ),

  );
}

function tutText(s){
  return s.split('\n').map((line,li)=>h('span',{key:li,style:{display:'block'}},
    line.split(/(\*\*[^*]+\*\*)/g).filter(Boolean).map((seg,i)=>seg.startsWith('**')?h('b',{key:i,className:'tut-em'},seg.slice(2,-2)):seg)
  ));
}

function TutorialScreen({pendingDiff,onFinish,onExit,trackNum,toggleMusic,coachName,startLabel,bg,winPt,onSecret}){
  const secretR=useRef(0);const secretT=useRef(0);
  function tapSecret(){const now=Date.now();if(now-secretT.current>2500)secretR.current=0;secretT.current=now;secretR.current++;
    try{resumeAC();fxTone({f:900+secretR.current*120,type:'sine',v:0.03,a:0.002,d:0.06,rev:0.2});}catch(e){}
    if(secretR.current>=7){secretR.current=0;onSecret&&onSecret();}}
  const WP=winPt||WIN_PT;
  const[si,setSi]=useState(0);
  const[board,setBoard]=useState({field:[],colors:[],hand:[],dealer:8});
  const[pPt,setPPt]=useState(0);
  const[dPt,setDPt]=useState(0);
  const[stage,setStage]=useState('ask');   // ask=説明中/タップ待ち  busy=演出中  after=結果説明
  const[combo,setCombo]=useState(null);
  const[burstAnim,setBurstAnim]=useState(false);
  const[resetFA,setResetFA]=useState(false);
  const[timeLeft,setTimeLeft]=useState(10);
  const timersR=useRef([]);
  const later=(fn,ms)=>{const t=setTimeout(fn,ms);timersR.current.push(t);return t;};
  useEffect(()=>()=>{timersR.current.forEach(clearTimeout);},[]);
  const step=TUT_STEPS[si];

  // ステップが変わったら盤面をセット
  useEffect(()=>{
    setStage('ask');setCombo(null);setBurstAnim(false);setResetFA(false);
    if(step.board&&step.board!=='keep')setBoard({...step.board,hand:[...step.board.hand]});
    if(step.timer){
      let t=10;setTimeLeft(t);
      const iv=setInterval(()=>{t--;setTimeLeft(t);if(t<=3)clearInterval(iv);},700);
      timersR.current.push(iv);
    }else setTimeLeft(10);
  },[si]);

  const fieldSum=board.field.reduce((a,b)=>a+b,0);
  const lastColor=board.colors[board.colors.length-1];
  const fieldCls=(fieldSum>=8&&fieldSum<10)?(lastColor==='player'?' alert-blue':' alert'):fieldSum>=5?' warn':'';

  function tap(idx){
    if(stage!=='ask'||!step.want)return;
    const v=board.hand[idx];
    if(v!==step.want)return;
    setStage('busy');
    resumeAC();later(()=>playPlaceSE(true),80);
    const nf=[...board.field,v],nc=[...board.colors,'player'];
    const nh=board.hand.map((x,i)=>i===idx?null:x);
    setBoard(b=>({...b,field:nf,colors:nc,hand:nh}));
    const r=step.result;
    if(r.type==='combo'){
      later(()=>{playComboSfx(r.text);setResetFA(true);setPPt(p=>p+r.pts);setCombo({text:r.text,pts:r.pts,color:'#2e7fe8',who:'player'});},350);
      later(()=>{setCombo(null);setResetFA(false);setStage('after');},3000);
    }else if(r.type==='burst'){
      later(()=>{playBurstSE();setBurstAnim(true);setPPt(p=>Math.max(0,p-2));setCombo({text:'BURST',pts:-2,color:'#ff3b3b',who:'player',burst:true});},350);
      later(()=>{setCombo(null);setBurstAnim(false);setStage('after');},3000);
    }else if(r.type==='dealerSteal'){
      later(()=>{playPlaceSE(false);setBoard(b=>({...b,field:[...b.field,r.card],colors:[...b.colors,'dealer'],dealer:Math.max(0,b.dealer-1)}));},900);
      later(()=>{playComboSfx(r.text);setResetFA(true);setDPt(p=>p+r.pts);setCombo({text:r.text,pts:r.pts,color:'#f5912a',who:'dealer'});},1250);
      later(()=>{setCombo(null);setResetFA(false);setStage('after');},3900);
    }
  }
  function next(){setSi(i=>Math.min(i+1,TUT_STEPS.length-1));}

  const isModal=!step.board||step.table||step.final;
  const showNext=!isModal&&(stage==='after'||!step.want);
  const bodyText=stage==='after'&&step.after?step.after:step.msg;
  const isLesson=s=>s.board&&!s.table&&!s.final;
  const boardSteps=TUT_STEPS.filter(isLesson).length;
  const boardIdx=Math.max(1,TUT_STEPS.slice(0,si+1).filter(isLesson).length);

  const hand=board.hand;
  const cardEl=(v,i)=>{
    if(v==null)return h('div',{key:i,style:{width:'var(--card-w)',height:'calc(var(--card-w) * 1.4)',flexShrink:0}});
    const isTarget=stage==='ask'&&step.want===v;
    const st=handCardState(v,fieldSum,board.field);
    const card=h(SlideCard,{key:'t'+si+'_'+i+'_'+v,value:v,onPlay:()=>tap(i),disabled:!isTarget,cardState:st,onLocked:()=>fxLockHint(lockReason(v,fieldSum,board.field)),cardRole:'player'});
    if(isTarget)return h('div',{key:'w'+i,className:'tut-target'},card);
    // 狙うカードがある間は、それ以外を暗く落とす
    return (stage==='ask'&&step.want)?h('div',{key:'d'+i,className:'tut-dim'},card):card;
  };

  return h('div',{className:'gp-screen'+(bg?' dark':''),style:bg?{backgroundImage:"url('"+bg+"')"}:null},
    combo&&h(CyberComboDisplay,{key:'tc_'+si+'_'+combo.text,combo}),

    // TOP BAR（本番と同じ）
    h('div',{className:'gp-top-bar'},
      h('div',{className:'gp-time-box'+(timeLeft<=5?' urgent':''),onClick:tapSecret,style:{cursor:'pointer'}}, // v126: TIMEを7回タップでルナ戦（隠し）
        h('div',{className:'lbl'},'TIME'),
        h('div',{className:'val'},timeLeft)
      ),
      h('div',{className:'gp-score you'},
        h('div',{className:'lbl'},'YOU'),
        h('div',{className:'val'},pPt),
        h('div',{className:'sub'},'あと ',h('b',null,Math.max(0,WP-pPt)),'pt')
      ),
      h('div',{className:'gp-round-pill'},
        h('span',{className:'lvl',style:{color:'#c98f00',fontWeight:900}},'TUTORIAL')
      ),
      h('div',{className:'gp-score dealer'},
        h('div',{className:'lbl'},'DEALER'),
        h('div',{className:'val'},dPt),
        h('div',{className:'sub'},'あと ',h('b',null,Math.max(0,WP-dPt)),'pt')
      ),
      h('div',{className:'gp-icon-btn',onClick:onExit,title:'ホームに戻る'},h('span',null,'⌂')),
      h('div',{className:'gp-track-btn'+(step.bgm?' tut-target tut-target-btn':''),onClick:toggleMusic,title:'曲を変更'},
        h('span',{className:'num'},trackNum===0?'OFF':String(trackNum).padStart(2,'0'))
      )
    ),

    // コーチ（ディーラーエリアの位置に置く）
    h('div',{className:'tut-coach'},
      h('div',{className:'tut-coach-head'},
        h('span',null,'✦ '+(coachName||'あそびかた')),
        h('span',{className:'cnt'},boardIdx+'/'+boardSteps),
        h('span',{className:'sp'}),
        h('span',{className:'dealer'},'DEALER '+board.dealer+'枚'),
        h('button',{className:'tut-skip',onClick:onExit},'スキップ')
      ),
      h('div',{className:'tut-coach-body',key:'b'+si+stage},tutText(bodyText)),
      showNext&&h('button',{className:'tut-next',onClick:next},step.next||'つぎへ')
    ),

    h('div',{className:'gp-spacer'}),

    // FIELD（本番と同じ）
    h('div',{className:'gp-field-area field-card-area'+fieldCls,style:{animation:resetFA?'resetAnim 0.5s ease':burstAnim?'burst 0.5s ease':'none'}},
      h('div',{className:'field-planet'}),
      h('div',{className:'tut-field-label'},'場 — ここの合計を10に'),
      h('div',{className:'gp-field-cards'},
        board.field.map((v,i)=>h(FieldCard,{key:'f'+si+'_'+i,value:v,by:board.colors[i],isComplete:fieldSum===10&&i===board.field.length-1}))
      ),
      h('div',{className:'gp-field-sum gp-field-sum-strong',style:{visibility:fieldSum>0?'visible':'hidden'}},
        h('div',{className:'main'},
          h('span',{className:'num'+fieldCls},fieldSum),
          h('span',{className:'sep'},'/ 10')
        ),
        h('div',{className:'ato'},'あと ',h('b',null,10-fieldSum))
      )
    ),

    h('div',{className:'gp-spacer'}),

    // HAND（本番と同じ）
    h('div',{className:'gp-hand-area hand-card-area'},
      h('div',{className:'gp-area-label'},'YOU — '+hand.filter(Boolean).length+'枚'),
      h('div',{className:'gp-hand-rows'},
        h('div',{className:'gp-hand-row'},hand.slice(0,5).map((v,i)=>cardEl(v,i))),
        h('div',{className:'gp-hand-row'},hand.slice(5).map((v,i)=>cardEl(v,i+5)))
      )
    ),
    h('div',{className:'gp-spacer'}),

    // モーダル（はじめ / 役一覧 / 準備OK）
    isModal&&h('div',{className:'tut-veil'},
      h('div',{className:'tut-modal'},
        h('div',{className:'ttl'},step.title),
        step.table&&h('div',{className:'tut-table'},
          TUT_TABLE.map(r=>[
            h('span',{key:r.nm+'n',className:'nm',style:{color:r.color}},r.nm),
            h('span',{key:r.nm+'c',className:'cd'},r.cd,h('span',{className:'st',style:{color:r.color}},r.lv>=2?' '+'✦'.repeat(r.lv):'')),
            h('span',{key:r.nm+'p',className:'pt'},r.pt+'pt')
          ])
        ),
        h('div',{className:'body'},tutText(step.msg)),
        step.final
          ?h('div',{style:{display:'flex',flexDirection:'column',gap:'calc(8 * var(--u))'}},
              h('button',{className:'tut-btn',onClick:()=>onFinish(pendingDiff||'easy')},startLabel||((DIFF_LABEL[pendingDiff]||'EASY')+' で対戦する')),
              h('button',{className:'tut-btn ghost',onClick:()=>onFinish(null)},'ホームへ戻る')
            )
          :h('button',{className:'tut-btn',onClick:next},step.next||'つぎへ')
      )
    )
  );
}

const SAVE_KEY='tenkuru-save';
function loadSave(){
  const base={stars:{},storyMapV2:true,storyIntroSeen:false};
  try{
    const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');
    const stars={...(s.stars||{})};
    // v121より前は7=ルナ、8=モルフォ。新しい本編7〜10と衝突しないよう初回だけ移す。
    if(!s.storyMapV2){
      if(stars[7])stars[11]=Math.max(stars[11]||0,stars[7]);
      if(stars[8])stars[12]=Math.max(stars[12]||0,stars[8]);
      delete stars[7];delete stars[8];
    }
    return {...base,...s,stars,chronoIntro:!!s.chronoIntro,storyMapV2:true,storyIntroSeen:!!s.storyIntroSeen};
  }
  catch(e){return base;}
}
function writeSave(s){try{localStorage.setItem(SAVE_KEY,JSON.stringify(s));}catch(e){}}
function areaProgress(save,area){
  const n=area.stages.length;let current=n;
  for(let i=0;i<n;i++){if(!save.stars[area.stages[i].no]){current=i;break;}}
  // v54: comingSoon（準備中）は進行度に数えない
  const playable=area.stages.filter(st=>!st.comingSoon&&!st.challenge); // v62: チャレンジは本編の進行に数えない
  const clearedCount=playable.filter(st=>save.stars[st.no]).length;
  // v56: AREA CLEAR はチャンピオン（boss）撃破後だけ
  const boss=playable.find(st=>st.boss);
  const allClear=boss?!!save.stars[boss.no]:clearedCount>=playable.length;
  return {current,clearedCount,n:playable.length,allClear};
}
function isStagePlayable(save,area,i){
  const st=area.stages[i];if(!st||st.comingSoon)return false;
  if(st.unlockAfter!=null)return !!save.stars[st.unlockAfter];
  if(st.challenge){const boss=area.stages.find(x=>x.boss);return !!(boss&&save.stars[boss.no]);} // v62: ST6(boss)クリアで解放。既存セーブの stars から判定
  if(save.stars[st.no])return true;                 // クリア済みは再挑戦OK
  return i===0||!!save.stars[area.stages[i-1].no];  // 直前がクリア済みなら解放
}

function calcStars(pPt,dPt,winPt){
  if(pPt<winPt)return 0;
  const r=dPt/winPt;
  return r<=0.4?3:r<=0.75?2:1;
}

function chargeAdvance(pool,now){
  const elapsed=Math.max(0,now-pool.at)/CHARGE_CFG.refillMs;
  return {player:Math.min(CHARGE_CFG.max,pool.player+elapsed),dealer:Math.min(CHARGE_CFG.max,pool.dealer+elapsed),at:Math.max(pool.at,now)};

  // 道の光：最後にクリアしたマスの次（＝現在地）まで

    const el=litRef.current;if(!el)return;

      h('div',{className:'a1-mapbox'},
        h('div',{className:'a1-core','aria-hidden':true}),
        h('svg',{className:'a1-svg',viewBox:'0 0 360 360'},
          h('defs',null,
            h('radialGradient',{id:'a1GlowCyan'},h('stop',{offset:'0%',stopColor:'#bff4ff',stopOpacity:.9}),h('stop',{offset:'55%',stopColor:'#5fd3ff',stopOpacity:.35}),h('stop',{offset:'100%',stopColor:'#5fd3ff',stopOpacity:0})),
            h('radialGradient',{id:'a1GlowGold'},h('stop',{offset:'0%',stopColor:'#fff1c0',stopOpacity:.9}),h('stop',{offset:'55%',stopColor:'#ffd35a',stopOpacity:.3}),h('stop',{offset:'100%',stopColor:'#ffd35a',stopOpacity:0}))
          ),

// v95: 画像の先読み。全部読めるか、上限時間で解決
function preloadImages(urls,maxMs){
  return new Promise(res=>{let left=urls.length,done=false;const fin=()=>{if(!done){done=true;res();}};
    const t=setTimeout(fin,maxMs||4000);
    urls.forEach(u=>{const im=new Image();im.onload=im.onerror=()=>{if(--left<=0){clearTimeout(t);fin();}};im.src=u;});
    if(!urls.length){clearTimeout(t);fin();}
  });
}

  // Charge checks run on its live match clock, independently of legacy FLOW_CFG.
  // Energy shortages are not deadlocks: a numerically safe card can wait for recharge.
  function checkChargeStuck(){
    const field=fieldR.current,flight=flyR.current;
    if((!isCharge()&&!isSurvival())||phaseR.current!=='playing'||rushClosedR.current||pausedR.current||countNumR.current>=0||resolvingR.current||lockR.current||sceneOnR.current||pStopR.current||rStopR.current||eraseBusyR.current||!field.length){chargeStuckR.current=null;return;}
    // Wait for an ordinary empty-hand refill, and count a card still in flight.
    if(!pHR.current.some(v=>v!==null)||(!dHR.current.length&&!flight)){chargeStuckR.current=null;return;}
    const safe=v=>v!=null&&canPlay(v,fieldSumR.current,field)&&fieldSumR.current+v<=10;
    if(pHR.current.some(safe)||dHR.current.some(safe)||(flight&&safe(flight.value))){chargeStuckR.current=null;return;}
    const now=performance.now(),pending=chargeStuckR.current;
    if(!pending||pending.field!==field){chargeStuckR.current={field,at:now};return;}
    if(now-pending.at<CHARGE_CFG.stuckMs)return;
    chargeStuckR.current=null;
    finishRushBoard(null,0,'場をリセット');
  }

  function scheduleAi(rn,delay=null){
    clearTimeout(aiRef.current);
    if(isCharge()){
      if(phaseR.current!=='playing'||rushClosedR.current||pausedR.current||countNumR.current>=0)return;
      updateCharge();
      if(chargeR.current.dealer+1e-9<1){aiRef.current=setTimeout(()=>aiPlay(rn),Math.max(1,Math.ceil((1-chargeR.current.dealer)*CHARGE_CFG.refillMs)));return;}
    }
    if(pStopR.current)return; // v148: 時間停止中は次の手を予約すらしない
    let d;const flNow=fieldR.current.length; // v239 何枚目か（0=1枚目）
    if(delay!==null){d=delay;}
    else{
      const cf=fieldR.current,cs=fieldSumR.current,fl=cf.length;
      const canWin=dHR.current.some(v=>canPlay(v,cs,cf)&&cs+v===10);

      else if(fl===0){if(diff==='easy')d=800+Math.random()*800;else if(diff==='hard')d=150+Math.random()*200;else if(diff==='master')d=120+Math.random()*180;else d=aiFirstFastRef.current?300+Math.random()*300:1200+Math.random()*800;}
      else if(fl===1)d=diff==='easy'?1000+Math.random()*600:diff==='hard'?400+Math.random()*200:diff==='master'?300+Math.random()*180:1000+Math.random()*400;
      else d=diff==='easy'?1200+Math.random()*800:diff==='hard'?600+Math.random()*300:diff==='master'?450+Math.random()*250:1500+Math.random()*500;
    }
    const _canWin10=dHR.current.some(v=>canPlay(v,fieldSumR.current,fieldR.current)&&fieldSumR.current+v===10);
    d=Math.round(d*((stageOptsR.current&&stageOptsR.current.speed)||1)); // v112: 速い相手
    if(delay===null&&stageOptsR.current&&stageOptsR.current.cardSpeed){const k=stageOptsR.current.cardSpeed[Math.min(flNow,3)];if(k!=null&&k>0)d=Math.round(d*k);} // v239 1〜4枚目それぞれの速さ倍率（調整モード）
    if(DEALER_BOOST.enabled&&stageR.current&&!(stageOptsR.current&&(stageOptsR.current.challenge||stageOptsR.current.noBoost)))d=Math.round(d*DEALER_BOOST.speed); // v196 通常ステージは全体的に速く
    // v135 セトラ: 初手だけ人のタップより速くして「GOで4枚連打」を封じる。
    // 逆に決定打(10完成)は遅らせる。反射神経で負けるのは理不尽で面白くないため
    const so135=stageOptsR.current||{};
    if(delay===null&&fieldR.current.length===0&&so135.firstMs)d=so135.firstMs+Math.round(Math.random()*(so135.firstJit||0));
    if(delay===null&&_canWin10&&so135.winMs)d=Math.max(d,so135.winMs+Math.round(Math.random()*(so135.winJit||0)));
    // v113: 10を完成させる一手だけは、速度倍率のあとでも下限220msを守る（v40の趣旨）
    // ここを消すと人が反応できない速さになる。モルフォを更に強くしたい時もこの行は残す
    if(delay===null&&_canWin10&&!isSurvival())d=Math.max(d,stageOptsR.current&&stageOptsR.current.cardSpeed?Math.max(80,Math.round(220*_csK())):220); // v240 調整の cardSpeed がある時は下限もその倍率（最低80ms）
    if(delay===null&&_canWin10&&so135.winMsAbs)d=Math.max(50,so135.winMsAbs); // v241 決定打の時間を直接指定（調整モード／ステージの winMsAbs）
    aiRef.current=setTimeout(()=>{if(phaseR.current==='playing'&&countNumR.current<0&&!linkR.current)aiPlay(rn);},d);
  }

  // v127 セトラ: 相手の手札を見て一手を評価する。
  // ねらい ①自分が10を取れるなら取る ②取れない時にプレイヤーへ10を渡さない
  //        ③どれを出しても届かない場面での無駄打ちをやめる
  function smartPick(playable,cs,cf){
    const pHand=pHR.current||[],frz=pFrzR.current||{};
    // プレイヤーが今この場に出せる札（凍結中は除く）。v248 blind（裏向き）の時は相手の手札が見えないので「1〜9どれでも持ってるかも」として読む
    const pUsable=(stageOptsR.current&&stageOptsR.current.blind)?[1,2,3,4,5,6,7,8,9]:pHand.map((v,i)=>(v!==null&&frz[i]==null)?v:null).filter(v=>v!==null);
    const scoreOf=v=>{
      const ns=cs+v,nf=[...cf,v];
      if(ns===10)return 10000+calcPts(nf).total*10; // 自分で完成：最優先。役が高い方をさらに優先
      if(ns>10)return -100000; // v137: バーストは絶対に選ばない（canPlayが10超えを許すため明示的に弾く）
      const need=10-ns;
      // この一手のあと、プレイヤーが即10を完成できてしまうか
      const gift=pUsable.some(w=>canPlay(w,ns,nf)&&ns+w===10);
      // プレイヤーが1枚も出せなくなるか（詰ませ）
      const stuck=!pUsable.some(w=>canPlay(w,ns,nf));
      // 自分が次に10を作れる札を持っているか
      const keep=(dHR.current||[]).some(w=>canPlay(w,ns,nf)&&ns+w===10);
      // v138: 決着札(need)を自分と相手のどちらが多く持っているか
      const mine=(dHR.current||[]).filter(w=>w===need).length-(v===need?1:0);
      const theirs=pUsable.filter(w=>w===need).length;
      let sc=0;
      if(gift)sc-=800;   // 塩を送らない
      if(stuck)sc+=400;  // 相手を動けなくする
      if(keep)sc+=600;   // 次の手で刈り取れる形を残す
      sc+=120*(mine-theirs); // 決着札を自分が握っている形を選ぶ
      // v138: ここが逆だった。場を低く保つと相手の選択肢が広がり、
      // 1ばかり出して自滅していた。場は高くして相手の手を狭める
      sc+=6*ns;
      return sc;
    };
    let best=null,bs=-1e9;
    playable.forEach(v=>{const s=scoreOf(v);if(s>bs){bs=s;best=v;}});
    if(bs<=-100000)return null; // v137: バーストしかできないなら出さずに待つ
    // v138: 以前は「どれも塩を送るなら待つ」としていたが、待っている間に
    // プレイヤーが自由に場を組めてしまうため、待つのはバースト時だけにした
    return best;
  }
  function smartActive(){const so=stageOptsR.current;return !!(so&&so.smart);}
  // v140 オルビィ: 「相手に10を作らせない」封殺の思考。
  // 自分で閉じられない列は最初から作らない。作れないなら出さずに待ち、
  // 時間切れリセットか、相手が動いた後のカウンターを狙う
  // v166: オルビィが何回動けて何回見送ったかを記録する（調査用。window.orbyLog で見る）
  const oLog=(k)=>{try{const w=window;w.__orby=w.__orby||{};w.__orby[k]=(w.__orby[k]||0)+1;
    clearTimeout(w.__orbyT);w.__orbyT=setTimeout(()=>setOrbyStat({...w.__orby}),120);}catch(e){}};
  function denyPick(playable,cs,cf,avail){
    const pHand=pHR.current||[],frz=pFrzR.current||{};
    const pUsable=(stageOptsR.current&&stageOptsR.current.blind)?[1,2,3,4,5,6,7,8,9]:pHand.map((v,i)=>(v!==null&&frz[i]==null)?v:null).filter(v=>v!==null); // v248 blind
    // v149: 温存中の環などを除いた「実際に出せる手札」で読む。
    // 以前は全手札で読んでいたため、使えない札を当てにして閉じられない列を作っていた
    const dHand=(avail&&avail.length)?avail.slice():(dHR.current||[]);
    const slots=4-cf.filter(x=>x!==null).length; // この列にあと何枚置けるか
    const sc=v=>{
      const ns=cs+v,nf=[...cf,v];
      if(ns===10)return 100000+calcPts(nf).total*200; // 取れるなら取る。役が高い方をさらに優先
      if(ns>10)return -1e6;
      const rest=dHand.slice();rest.splice(rest.indexOf(v),1);
      const closeNow=rest.some(w=>canPlay(w,ns,nf)&&ns+w===10); // 次の一手で決められるか
      const gift=pUsable.some(w=>canPlay(w,ns,nf)&&ns+w===10);
      // v167: 「相手に渡すなら絶対に出さない」も固まる原因だった（687回中183回）。
      // 待っている間に相手は自由に組めるので、待つこと自体が損。
      // 拒否ではなく大きな減点にして、他に手が無いときは出すようにする
      if(gift&&!closeNow)return -4000+8*ns;
      // 自分の手札だけで、残り枠内に合計10へ到達できるか（枚数制限つきの部分和）
      const reach=(sum,depth,pool)=>{
        if(sum===10)return true;
        if(sum>10||depth<=0)return false;
        for(let k=0;k<pool.length;k++){
          const p2=pool.slice();const w=p2.splice(k,1)[0];
          if(reach(sum+w,depth-1,p2))return true;
        }
        return false;
      };
      const iCanFinish=reach(ns,slots-1,rest);
      // v164: 「この手を出した後、相手が10を作れる道が何通りあるか」を数える。
      // くるみの打ち方（3を出すと相手に3-4で持っていかれるから2を出す）を式にしたもの。
      // 相手の道が少なく、自分の道が多い手を選ぶ
      const waysTo10=(hand,sum,depth,fld)=>{
        if(sum===10)return 1;
        if(sum>10||depth<=0)return 0;
        let c=0;
        for(let k=0;k<hand.length&&k<8;k++){
          const h2=hand.slice();const w=h2.splice(k,1)[0];
          if(!canPlay(w,sum,fld))continue;
          c+=waysTo10(h2,sum+w,depth-1,[...fld,w]);
        }
        return c;
      };
      const oppWays=waysTo10(pUsable,ns,slots-1,nf);
      const myWays=waysTo10(rest,ns,slots-1,nf);
      const stuck=!pUsable.some(w=>canPlay(w,ns,nf));
      let s=0;
      if(iCanFinish)s+=3000;  // 自分で閉じられる列だけ作る
      s-=oppWays*120;         // v164: 相手に完成の道を与えない
      s+=myWays*90;           // v164: 自分の分岐が多い形を選ぶ
      if(closeNow)s+=2500;    // 次の一手で決められる形を優先
      if(gift)s-=700;         // 競り合いになる分は割り引く
      if(stuck)s+=800;        // 相手を動けなくする
      // v147: 余裕があるときは強い役を狙う。到達できる最大の役を見積もって加点
      if(iCanFinish){
        let bestPt=0;
        const dig=(sum,depth,pool,used)=>{
          if(sum===10){bestPt=Math.max(bestPt,calcPts([...nf,...used]).total);return;}
          if(sum>10||depth<=0)return;
          for(let k=0;k<pool.length;k++){
            const p2=pool.slice();const w=p2.splice(k,1)[0];
            dig(sum+w,depth-1,p2,[...used,w]);
          }
        };
        dig(ns,slots-1,rest,[]);
        s+=bestPt*90;
      }
      s+=8*ns;
      return s;
    };
    let best=null,bs=-1e9;
    playable.forEach(v=>{const x=sc(v);if(x>bs){bs=x;best=v;}});
    if(bs<=-1e5){oLog('skip_gift');return null;}  // 相手に渡すだけ／バースト → 出さない
    // v167: 以前は「自分で閉じられない列は始めない」で止めていたが、
    // 手札が3枚以下だと76%以上がこれに該当し、687回中470回も動けなくなっていた。
    // 待っても相手は自由に組めるので、待つのは損。手札が十分ある時だけ選り好みする
    if(bs<3000&&cs===0&&dHand.length>=6){oLog('skip_nostart');return null;}
    oLog('play');return best;
  }
  // v140 オルビィの星環：出した瞬間に3種のうち1つがランダムで起きる

  // v164: 3つの枠が手札の上をさまよい、椅子取りゲームのようにピタッと止まって抜かれる。

  // v168: 停止中に「次に出す札」へカーソルを移動させておく。

  function denyActive(){const so=stageOptsR.current;return !!(so&&so.deny);}
  // v265 計測：1手ずつの記録。対戦画面には出さず、結果画面でだけ見る
  function survLog(who,text){
    if(!isSurvival())return;
    const st=survStatR.current;if(!st)return;
    const t=(60-Math.max(0,(rushDeadlineR.current-performance.now())/1000)).toFixed(1);

  // v264 役サバイバル専用の思考。カードは役を作らないと増えないので「補充につながる10」を狙い、
  // 大きい役ほど補充が多い。相手に10を渡す置き方は嫌う
  function survivalPick(playable,cs,cf){
    const diff=diffRef.current,sharp=diff==='hard';
    const wins=playable.filter(v=>cs+v===10);
    const safe=playable.filter(v=>cs+v<10);
    const stock=dHR.current.length+dResR.current.length;
    const gainOf=v=>calcPts([...cf,v]).total; // 補充枚数＝得点と同じ
    if(wins.length){
      const best=wins.reduce((b,v)=>gainOf(v)>gainOf(b)?v:b,wins[0]);
      const g=gainOf(best);
      // v269 補充が1枚以上になったので完成は常に得。ただし手札に余裕があるときだけ、より大きい役を狙って1手待つ
      const better=safe.length&&g<=1&&stock>=7&&Math.random()<(sharp?0.55:0.3);
      if(!better&&(g>=2||Math.random()<(sharp?0.97:0.85))){survLog('dealer',best+'を出す ← 完成ねらい（補充+'+g+'）');return best;}
      if(better){survStatR.current&&survStatR.current.dealer.skip++;survLog('dealer','完成を見送り（役なし止まり・在庫'+stock+'枚あるので大きい役を狙う）');}
    }
    if(!safe.length)return wins.length?wins[0]:null;
    // v274 このモードは「先に場を開けた側が損」。開けた1枚は相手の完成材料になりやすいので、
    //      手札で負けているうちは自分からは開けず、相手に開けさせて刈り取る側にまわる
    if(!cf.length){
      const pN=pHR.current.filter(v=>v!=null).length;
      if(stock<=pN+1&&Math.random()<0.9){if(waitLogR.current!=='open'){waitLogR.current='open';survLog('dealer','場を開けずに待つ（自分'+stock+'枚 / 相手'+pN+'枚・開けた側が損）');}return null;}
      const opener=safe.filter(v=>10-v>5); // 出しても1枚では10にされない札（1〜4）
      if(opener.length){const o=opener.sort((a,b)=>a-b)[0];survLog('dealer',o+'を出す ← 場を開ける（1枚では取られない）');return o;}
    }
    // v271 場を育てるのは「自分で仕上げられる時」だけ。仕上げ札がないのに置くと、相手に10をプレゼントして
    //      こっちは1枚失うだけになる（計測で相手が11枚出して完成1回だった原因）
    const mine=v=>dHR.current.includes(10-(cs+v));        // 出したあと自分で10にできる
    const gift=v=>{const need=10-(cs+v);return need>=1&&need<=5;}; // 相手も1枚で10にできる
    const okList=safe.filter(v=>mine(v)||!gift(v));
    if(!okList.length){
      // どれを置いても相手に渡してしまう。手札に余裕がなければ置かずに待つ
      if(stock<=8&&Math.random()<(sharp?0.92:0.7)){const k='hold'+cs;if(waitLogR.current!==k){waitLogR.current=k;survLog('dealer','置かずに待つ（どれを出しても相手に10を渡す・在庫'+stock+'枚）');}return null;}
    }
    const pool=okList.length?okList:safe;
    const score=v=>{
      const nf=[...cf,v],ns=cs+v,need=10-ns;
      let sc=0;
      let bestRole=0;
      for(let k=1;k<=5;k++)if(ns+k===10&&canPlay(k,ns,nf))bestRole=Math.max(bestRole,calcPts([...nf,k]).total);
      sc+=bestRole*1.4;                                   // このあと作れる役の大きさ
      if(mine(v))sc+=6.0;                                 // 自分で仕上げられる（最重要）
      if(gift(v))sc-=5.5;                                 // 相手にも仕上げられてしまう
      if(gift(v)&&mine(v))sc+=1.5;                        // 撃ち合いなら先に取れる可能性がある分だけ戻す
      sc-=v*0.12;                                         // 小さい札から出して選択肢を残す
      if(cf.length>=3)sc-=1.2;                            // 4枚目は慎重に
      return sc+(sharp?0:Math.random()*1.2);              // ふつうは少しブレる
    };
    waitLogR.current=null;
    const pick=pool.reduce((b,v)=>score(v)>score(b)?v:b,pool[0]);
    const ns=cs+pick,need=10-ns;let br=0;
    for(let k=1;k<=5;k++)if(ns+k===10&&canPlay(k,ns,[...cf,pick]))br=Math.max(br,calcPts([...cf,pick,k]).total);
    survLog('dealer',pick+'を出す ← 場'+cs+'→'+ns+'／次に最大+'+br+'補充'+(dHR.current.includes(need)?'／自分で仕上げ可':'')+((need>=1&&need<=5)?'／相手も仕上げ可':''));
    return pick;
  }
  function aiPlay(rn){
    if(isTimedMode()&&rushExpired())return;

    const avail=dHand.filter((v,i)=>eligible(i)); // v79: 星環付きは温存。v121: レイピアが今タップした札は専用処理に任せる

    const safeRate5=diff==='easy'?0.25:diff==='hard'?0.60:diff==='master'?0.75:0.35;
    const safeBase =diff==='easy'?0.35:diff==='hard'?0.70:diff==='master'?0.80:0.40;
    const safeCap  =diff==='easy'?0.50:diff==='hard'?0.90:diff==='master'?0.95:0.65;

      // MASTERの妨害プレイ：手札に1がある時、場を合計9にして「1でしか完成できない場」の罠を張り、自分の1で刈り取る

  function playCard(idx){
